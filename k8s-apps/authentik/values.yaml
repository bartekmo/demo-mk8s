# global.dnsRoot is injected by the Argo CD ApplicationSet (k8s-bootstrap).
#
# All secrets come from the "authentik-bootstrap" Secret, generated in-cluster
# by the node bootstrap script (never stored in Git or Terraform state):
#   secret-key, postgres-password, postgres-admin-password,
#   akadmin-password, demo-password, <client>-client-secret per oidcClients

# Look of the login pages (default brand), applied via the bootstrap blueprint.
# URLs may contain %(theme)s for light/dark variants. Empty = authentik default.
branding:
  title: ""
  background: https://raw.githubusercontent.com/bartekmo/demo-mk8s/refs/heads/main/k8s-apps/authentik/accelerate25-blog-hero.jpg
  logo: ""
  favicon: ""

# OIDC clients registered in authentik by the blueprint. client_id = name,
# redirect = https://<host>.<dnsRoot><redirectPath>; icon = tile icon URL
# (tiles open in a new tab). Each secretEnv must be
# wired to an authentik-bootstrap key in authentik.global.env below (the node
# bootstrap generates "<name>-client-secret" and copies it to the app).
oidcClients:
  - name: argocd
    title: Argo CD
    host: argocd
    redirectPath: /auth/callback
    secretEnv: ARGOCD_CLIENT_SECRET
    icon: https://github.com/bartekmo/demo-mk8s/blob/main/k8s-apps/authentik/logos/argocd.png?raw=true
  - name: gitlab
    title: GitLab
    host: gitlab
    redirectPath: /users/auth/openid_connect/callback
    secretEnv: GITLAB_CLIENT_SECRET
    icon: https://github.com/bartekmo/demo-mk8s/blob/main/k8s-apps/authentik/logos/gitlab.webp?raw=true

# Domain-level forward auth for apps without native SSO (code-server, ...):
# authentik's embedded outpost answers Traefik ForwardAuth requests; login
# happens on auth.<dnsRoot> and the session cookie covers *.<dnsRoot>.
# Apps opt in with a Traefik Middleware pointing at
#   http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
# Only allowedUsers get through.
forwardAuth:
  enabled: true
  # application tile in the authentik user dashboard (opens code-server)
  title: IDE
  icon: https://github.com/bartekmo/demo-mk8s/blob/main/k8s-apps/authentik/logos/code.png?raw=true
  allowedUsers:
    - demo

authentik:
  global:
    env:
      - name: AUTHENTIK_SECRET_KEY
        valueFrom:
          secretKeyRef: { name: authentik-bootstrap, key: secret-key }
      - name: AUTHENTIK_POSTGRESQL__PASSWORD
        valueFrom:
          secretKeyRef: { name: authentik-bootstrap, key: postgres-password }
      # initial password of the built-in "akadmin" superuser (first start only)
      - name: AUTHENTIK_BOOTSTRAP_PASSWORD
        valueFrom:
          secretKeyRef: { name: authentik-bootstrap, key: akadmin-password }
      # consumed by the blueprint (!Env) in templates/blueprints.yaml
      - name: DEMO_PASSWORD
        valueFrom:
          secretKeyRef: { name: authentik-bootstrap, key: demo-password }
      - name: ARGOCD_CLIENT_SECRET
        valueFrom:
          secretKeyRef: { name: authentik-bootstrap, key: argocd-client-secret }
      - name: GITLAB_CLIENT_SECRET
        valueFrom:
          secretKeyRef: { name: authentik-bootstrap, key: gitlab-client-secret }

  authentik:
    # real values come from the env above; the chart's secret must not set them
    secret_key: ""
    error_reporting:
      enabled: false
    postgresql:
      password: ""

  blueprints:
    configMaps:
      - authentik-bootstrap-blueprints

  # Ingress is defined in templates/ingress.yaml (needs global.dnsRoot)
  server:
    ingress:
      enabled: false

  postgresql:
    enabled: true
    auth:
      existingSecret: authentik-bootstrap
      secretKeys:
        adminPasswordKey: postgres-admin-password
        userPasswordKey: postgres-password
    primary:
      persistence:
        enabled: true
        size: 10Gi # uses the default StorageClass (pd-balanced)
