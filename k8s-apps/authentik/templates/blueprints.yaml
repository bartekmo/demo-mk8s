{{- $dns := required "global.dnsRoot is required" .Values.global.dnsRoot -}}
# Applied by the authentik worker on start and whenever it changes.
# Passwords/secrets are read from the worker's environment (!Env), which is
# fed from the in-cluster "authentik-bootstrap" Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-bootstrap-blueprints
data:
  demo-bootstrap.yaml: |
    version: 1
    metadata:
      name: demo-bootstrap
    entries:
      {{- with .Values.branding }}
      {{- if or .title .background .logo .favicon }}
      # Default brand: look of all flows (login, consent, logout, ...)
      - model: authentik_brands.brand
        identifiers:
          domain: authentik-default
        attrs:
          default: true
          {{- with .title }}
          branding_title: {{ . | quote }}
          {{- end }}
          {{- with .background }}
          branding_default_flow_background: {{ . | quote }}
          {{- end }}
          {{- with .logo }}
          branding_logo: {{ . | quote }}
          {{- end }}
          {{- with .favicon }}
          branding_favicon: {{ . | quote }}
          {{- end }}
      {{- end }}
      {{- end }}

      # Members get role:admin in Argo CD (see argocd-rbac-cm in k8s-bootstrap)
      - model: authentik_core.group
        id: argocd-admins
        identifiers:
          name: argocd-admins

      - model: authentik_core.user
        id: demo-user
        identifiers:
          username: demo
        attrs:
          name: Demo User
          email: demo@{{ $dns }}
          password: !Env DEMO_PASSWORD
          groups:
            - !KeyOf argocd-admins

      # --- OIDC clients (values: oidcClients) ---
      {{- range .Values.oidcClients }}
      - model: authentik_providers_oauth2.oauth2provider
        id: {{ .name }}-provider
        identifiers:
          name: {{ .name }}
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          # empty by default for blueprint-created providers (authentik 2026.x),
          # which makes /authorize reject every request as "malformed"
          grant_types:
            - authorization_code
            - refresh_token
          client_id: {{ .name }}
          client_secret: !Env {{ .secretEnv }}
          redirect_uris:
            - matching_mode: strict
              url: https://{{ .host }}.{{ $dns }}{{ .redirectPath }}
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          # "profile" includes the groups claim (used by Argo CD RBAC)
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

      - model: authentik_core.application
        identifiers:
          slug: {{ .name }}
        attrs:
          name: {{ .title }}
          provider: !KeyOf {{ .name }}-provider
          meta_launch_url: https://{{ .host }}.{{ $dns }}
          open_in_new_tab: true
          {{- with .icon }}
          meta_icon: {{ . | quote }}
          {{- end }}
      {{- end }}

      {{- if .Values.forwardAuth.enabled }}
      # --- Domain-level forward auth (Traefik ForwardAuth -> embedded outpost) ---
      - model: authentik_providers_proxy.proxyprovider
        id: forward-auth-provider
        identifiers:
          name: forward-auth
        attrs:
          mode: forward_domain
          external_host: https://auth.{{ $dns }}
          cookie_domain: {{ $dns }}
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          # also set by the serializer; explicit because blueprint defaults are empty
          grant_types:
            - authorization_code

      - model: authentik_core.application
        id: forward-auth-app
        identifiers:
          slug: forward-auth
        attrs:
          name: {{ .Values.forwardAuth.title | quote }}
          provider: !KeyOf forward-auth-provider
          meta_launch_url: https://code.{{ $dns }}
          open_in_new_tab: true
          {{- with .Values.forwardAuth.icon }}
          meta_icon: {{ . | quote }}
          {{- end }}

      # once any binding exists, only bound users may use the application
      {{- range $i, $u := .Values.forwardAuth.allowedUsers }}
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf forward-auth-app
          user: !Find [authentik_core.user, [username, {{ $u }}]]
        attrs:
          order: {{ $i }}
      {{- end }}

      # serve the provider from the outpost built into authentik-server
      - model: authentik_outposts.outpost
        identifiers:
          managed: goauthentik.io/outposts/embedded
        attrs:
          providers:
            - !KeyOf forward-auth-provider
          # public URL used for browser redirects; the default ("") makes the
          # outpost send users to localhost. Omitted keys keep their defaults.
          config:
            authentik_host: https://auth.{{ $dns }}
            authentik_host_insecure: false
      {{- end }}
