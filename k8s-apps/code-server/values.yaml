# global.dnsRoot is injected by the Argo CD ApplicationSet (k8s-bootstrap).
# Reachable at https://code.<dnsRoot>; authentication is done by authentik
# (Traefik ForwardAuth -> embedded outpost, see k8s-apps/authentik forwardAuth),
# so code-server itself runs with --auth none.

# Fallback only. The effective image is set in GitLab, in
# demo-apps/codeshell:deploy/code-server-values.yaml, which Argo CD layers on
# top of these values (see k8s-bootstrap/argocd-code-server-app.yaml.tftpl);
# codeshell's CI updates it after every build. Must contain code-server.
image: codercom/code-server:4.146.0

# persistent /home/coder: settings, extensions, cloned repos
storage:
  size: 20Gi

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    memory: 4Gi

# GitLab integration. The demo user's token comes from Secret
# code-server-gitlab (generated in-cluster by the node bootstrap and seeded
# into GitLab by its post-start script). It authenticates git (credential
# helper), glab and the GitLab Workflow extension via environment variables.
gitlab:
  tokenSecret: code-server-gitlab
  # cloned into ~/projects/<name> on first start (waits for GitLab)
  repos:
    - demo-apps/codeshell
  # folder opened in the IDE
  openFolder: /home/coder/projects/codeshell

# installed into the persistent home on start (from Open VSX)
extensions:
  - gitlab.gitlab-workflow

# extra environment for the shell
env: []
