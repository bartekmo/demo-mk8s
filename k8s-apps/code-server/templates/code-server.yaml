{{- $dns := required "global.dnsRoot is required" .Values.global.dnsRoot -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: code-server-home
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server
  labels:
    app.kubernetes.io/name: code-server
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO home volume
  selector:
    matchLabels:
      app.kubernetes.io/name: code-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: code-server
    spec:
      securityContext:
        fsGroup: 1000 # image runs as "coder" (1000)
      containers:
        - name: code-server
          image: {{ .Values.image }}
          args:
            - --bind-addr=0.0.0.0:8080
            - --auth=none # authentik forward auth in front (Traefik middleware)
            - --disable-telemetry
            - --disable-update-check
            - --proxy-domain=code.{{ $dns }}
          env:
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: home, mountPath: /home/coder }
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: code-server-home
---
apiVersion: v1
kind: Service
metadata:
  name: code-server
spec:
  selector:
    app.kubernetes.io/name: code-server
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Every request is checked by authentik's embedded outpost first; unauthenticated
# browsers are redirected to auth.<dnsRoot>, non-allowed users get 403.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: code-server
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # <namespace>-<middleware>@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-authentik@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: code.{{ $dns }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: code-server, port: { name: http } }
  tls:
    - hosts:
        - code.{{ $dns }}
      secretName: code-server-tls
