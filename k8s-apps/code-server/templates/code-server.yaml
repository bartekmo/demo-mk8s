{{- $dns := required "global.dnsRoot is required" .Values.global.dnsRoot -}}
{{- define "code-server.gitlabEnv" -}}
{{- $dns := .Values.global.dnsRoot -}}
- name: GITLAB_TOKEN
  valueFrom:
    secretKeyRef: { name: {{ .Values.gitlab.tokenSecret }}, key: token }
# glab
- name: GITLAB_HOST
  value: gitlab.{{ $dns }}
# GitLab Workflow extension (PAT via env, read when VS Code starts)
- name: GITLAB_WORKFLOW_INSTANCE_URL
  value: https://gitlab.{{ $dns }}
- name: GITLAB_WORKFLOW_TOKEN
  valueFrom:
    secretKeyRef: { name: {{ .Values.gitlab.tokenSecret }}, key: token }
# git config via environment: token credential helper + identity
- name: GIT_CONFIG_COUNT
  value: "3"
- name: GIT_CONFIG_KEY_0
  value: credential.https://gitlab.{{ $dns }}.helper
- name: GIT_CONFIG_VALUE_0
  value: '!f() { test "$1" = get && echo username=oauth2 && echo "password=$GITLAB_TOKEN"; }; f'
- name: GIT_CONFIG_KEY_1
  value: user.name
- name: GIT_CONFIG_VALUE_1
  value: Demo User
- name: GIT_CONFIG_KEY_2
  value: user.email
- name: GIT_CONFIG_VALUE_2
  value: demo@{{ $dns }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: code-server-home
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server
  labels:
    app.kubernetes.io/name: code-server
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO home volume
  selector:
    matchLabels:
      app.kubernetes.io/name: code-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: code-server
    spec:
      securityContext:
        fsGroup: 1000 # image runs as "coder" (1000)
      initContainers:
        # extensions go to the persistent home; already installed = no-op
        - name: extensions
          image: {{ .Values.image }}
          command: [/bin/sh, -c]
          args:
            - |
              {{- range .Values.extensions }}
              code-server --install-extension {{ . }} || echo "WARN: could not install {{ . }}"
              {{- end }}
          volumeMounts:
            - { name: home, mountPath: /home/coder }
        # clone the demo repos once; waits for GitLab, DNS/cert and seeded content
        - name: clone
          image: {{ .Values.image }}
          env:
            {{- include "code-server.gitlabEnv" . | nindent 12 }}
          command: [/bin/sh, -c]
          args:
            - |
              mkdir -p /home/coder/projects
              {{- range .Values.gitlab.repos }}
              dir=/home/coder/projects/{{ base .path }}
              if [ ! -d "$dir/.git" ]; then
                until rm -rf "$dir.tmp" && git clone -q https://gitlab.{{ $dns }}/{{ .path }}.git "$dir.tmp" \
                      && git -C "$dir.tmp" rev-parse -q --verify HEAD >/dev/null; do
                  echo "waiting for {{ .path }} on GitLab..."; sleep 20
                done
                {{- with .prepare }}
                {{- range .remove }}
                rm -rf "$dir.tmp/{{ . }}"
                {{- end }}
                {{- with .files }}
                # -L: ConfigMap files are symlinks; .[!.]* skips the ..data dirs
                cp -L /workspace/{{ . }}/* /workspace/{{ . }}/.[!.]* "$dir.tmp/"
                {{- end }}
                {{- end }}
                mv "$dir.tmp" "$dir" && echo "cloned {{ .path }}"
              fi
              {{- end }}
          volumeMounts:
            - { name: home, mountPath: /home/coder }
            {{- range .Values.gitlab.repos }}
            {{- with (.prepare).files }}
            - { name: workspace-{{ . }}, mountPath: /workspace/{{ . }} }
            {{- end }}
            {{- end }}
      containers:
        - name: code-server
          image: {{ .Values.image }}
          args:
            - --bind-addr=0.0.0.0:8080
            - --auth=none # authentik forward auth in front (Traefik middleware)
            - --disable-telemetry
            - --disable-update-check
            - --proxy-domain=code.{{ $dns }}
            {{- with .Values.gitlab.openFolder }}
            - {{ . }}
            {{- end }}
          env:
            {{- include "code-server.gitlabEnv" . | nindent 12 }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvSecret }}
          # optional: absent / empty Secret just adds nothing
          envFrom:
            - secretRef: { name: {{ . }}, optional: true }
          {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: home, mountPath: /home/coder }
      volumes:
        {{- range .Values.gitlab.repos }}
        {{- with (.prepare).files }}
        - name: workspace-{{ . }}
          configMap: { name: code-server-workspace-{{ . }} }
        {{- end }}
        {{- end }}
        - name: home
          persistentVolumeClaim:
            claimName: code-server-home
---
apiVersion: v1
kind: Service
metadata:
  name: code-server
spec:
  selector:
    app.kubernetes.io/name: code-server
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Every request is checked by authentik's embedded outpost first; unauthenticated
# browsers are redirected to auth.<dnsRoot>, non-allowed users get 403.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: code-server
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # <namespace>-<middleware>@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-authentik@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: code.{{ $dns }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: code-server, port: { name: http } }
  tls:
    - hosts:
        - code.{{ $dns }}
      secretName: code-server-tls
