apiVersion: v1
kind: Service
metadata:
  name: mariadb
  labels:
    app.kubernetes.io/name: mariadb
spec:
  selector:
    app.kubernetes.io/name: mariadb
  ports:
    - { name: mysql, port: 3306, targetPort: mysql }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  labels:
    app.kubernetes.io/name: mariadb
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb
    spec:
      securityContext:
        fsGroup: 999 # mysql user of the official image
      containers:
        - name: mariadb
          image: {{ .Values.image }}
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.passwordSecret }}, key: {{ .Values.rootPasswordKey }} }
            {{- with .Values.database }}
            - name: MARIADB_DATABASE
              value: {{ .name | quote }}
            - name: MARIADB_USER
              value: {{ .user | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $.Values.passwordSecret }}, key: {{ .passwordKey }} }
            {{- end }}
          ports:
            - { name: mysql, containerPort: 3306 }
          # healthcheck.sh ships with the official image
          readinessProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [healthcheck.sh, --connect]
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.storage.size }}
