apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitlab
  labels:
    app.kubernetes.io/name: gitlab
spec:
  serviceName: gitlab
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitlab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitlab
      annotations:
        # restart (and reconfigure) when gitlab.rb changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: gitlab
          image: {{ .Values.image }}
          command: ["/bin/bash", "-c", "/opt/post-start/post-start.sh & exec /assets/init-container"]
          env:
            - name: GITLAB_OMNIBUS_CONFIG
              valueFrom:
                configMapKeyRef: { name: gitlab-config, key: gitlab.rb }
            - name: GITLAB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: gitlab-bootstrap, key: root-password }
            - name: GITLAB_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: gitlab-bootstrap, key: oidc-client-secret }
            - name: GITLAB_RUNNER_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef: { name: gitlab-bootstrap, key: runner-bootstrap-token }
            - name: GITLAB_DEMO_TOKEN
              valueFrom:
                secretKeyRef: { name: gitlab-bootstrap, key: demo-token }
          ports:
            - { name: http, containerPort: 80 }
            - { name: registry, containerPort: 5050 }
            - { name: ssh, containerPort: 22 }
          # first start (DB init + reconfigure) can take ~10 minutes
          startupProbe:
            httpGet: { path: /-/liveness, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          livenessProbe:
            httpGet: { path: /-/liveness, port: http }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /-/readiness, port: http }
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /etc/gitlab, subPath: config }
            - { name: data, mountPath: /var/opt/gitlab, subPath: data }
            - { name: logs, mountPath: /var/log/gitlab }
            - { name: shm, mountPath: /dev/shm }
            - { name: post-start, mountPath: /opt/post-start }
            - { name: seed-codeshell, mountPath: /opt/seed/codeshell }
      volumes:
        - name: logs
          emptyDir: {}
        # bundled Postgres needs more shared memory than the 64M default
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 256Mi }
        - name: post-start
          configMap:
            name: gitlab-config
            defaultMode: 0755
            items:
              - { key: post-start.sh, path: post-start.sh }
              - { key: bootstrap.rb, path: bootstrap.rb }
        - name: seed-codeshell
          configMap:
            name: gitlab-seed-codeshell
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.storage.size }}
