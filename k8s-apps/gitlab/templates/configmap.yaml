{{- $dns := required "global.dnsRoot is required" .Values.global.dnsRoot -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-config
data:
  # Evaluated as Ruby by "gitlab-ctl reconfigure" on every container start;
  # ENV[...] values come from the gitlab-bootstrap Secret.
  gitlab.rb: |
    external_url 'https://gitlab.{{ $dns }}'
    registry_external_url 'https://registry.{{ $dns }}'

    # TLS is terminated by Traefik (Let's Encrypt via cert-manager)
    letsencrypt['enable'] = false
    nginx['listen_port'] = 80
    nginx['listen_https'] = false
    nginx['proxy_set_headers'] = { 'X-Forwarded-Proto' => 'https', 'X-Forwarded-Ssl' => 'on' }
    nginx['real_ip_trusted_addresses'] = ['10.0.0.0/8']
    nginx['real_ip_header'] = 'X-Forwarded-For'
    registry_nginx['listen_port'] = 5050
    registry_nginx['listen_https'] = false
    registry_nginx['proxy_set_headers'] = { 'X-Forwarded-Proto' => 'https', 'X-Forwarded-Ssl' => 'on' }
    gitlab_rails['trusted_proxies'] = ['10.0.0.0/8']

    # git over SSH: external LB :22 -> MetalLB IP -> this container's sshd
    gitlab_rails['gitlab_shell_ssh_port'] = 22

    # Container / small-footprint settings
    package['modify_kernel_parameters'] = false
    prometheus_monitoring['enable'] = false
    puma['worker_processes'] = {{ .Values.puma.workers }}
    sidekiq['concurrency'] = {{ .Values.sidekiq.concurrency }}
    # kubelet probes come from the pod network
    gitlab_rails['monitoring_whitelist'] = ['127.0.0.0/8', '10.0.0.0/8']

    # Local break-glass admin "root" (password set on first start only)
    gitlab_rails['initial_root_password'] = ENV['GITLAB_ROOT_PASSWORD']
    gitlab_rails['store_initial_root_password'] = false

    # SSO via authentik. Users are created on first login; the login page
    # redirects straight to authentik. root signs in at
    # https://gitlab.{{ $dns }}/users/sign_in?auto_sign_in=false
    gitlab_rails['omniauth_enabled'] = true
    gitlab_rails['omniauth_allow_single_sign_on'] = ['openid_connect']
    gitlab_rails['omniauth_block_auto_created_users'] = false
    gitlab_rails['omniauth_auto_link_user'] = ['openid_connect']
    gitlab_rails['omniauth_auto_sign_in_with_provider'] = 'openid_connect'
    gitlab_rails['omniauth_providers'] = [
      {
        name: 'openid_connect',
        label: 'authentik',
        args: {
          name: 'openid_connect',
          scope: ['openid', 'profile', 'email'],
          response_type: 'code',
          issuer: 'https://auth.{{ $dns }}/application/o/gitlab/',
          discovery: true,
          pkce: true,
          uid_field: 'preferred_username',
          client_options: {
            identifier: 'gitlab',
            secret: ENV['GITLAB_OIDC_CLIENT_SECRET'],
            redirect_uri: 'https://gitlab.{{ $dns }}/users/auth/openid_connect/callback'
          }
        }
      }
    ]

  # Runs in the background next to GitLab and applies the demo bootstrap
  # (bootstrap.rb) once GitLab is ready. Re-applied on every start.
  post-start.sh: |
    #!/bin/bash
    until curl -sf -o /dev/null http://localhost/-/readiness; do sleep 15; done
    echo "post-start: running demo bootstrap"
    gitlab-rails runner /opt/post-start/bootstrap.rb

  # Idempotent: creates what is missing, leaves existing objects alone.
  # Token values come from Secret gitlab-bootstrap (generated in-cluster by the
  # node bootstrap), so they are known to the consumers before GitLab starts.
  bootstrap.rb: |
    def log(msg)
      puts "post-start: #{msg}"
    end

    # GitLab >= 17 scopes users/groups/tokens to an organization
    ORG = defined?(Organizations::Organization) ? Organizations::Organization.first : nil
    DNS = Gitlab.config.gitlab.host.sub(/\Agitlab\./, "")

    # services return either the object or a ServiceResponse, depending on version
    def unwrap(result, key)
      result.respond_to?(:payload) ? result.payload[key] : result
    end

    def seed_token(user, name, scopes, value)
      return log("#{name}: no value provided, skipped") if value.to_s.empty?
      cur = user.personal_access_tokens.find_by(name: name)
      if cur && cur.active? && cur.expires_at > 30.days.from_now &&
         cur.scopes.map(&:to_s).sort == scopes.sort
        return log("#{name} token present for #{user.username}")
      end
      user.personal_access_tokens.where(name: name).delete_all
      attrs = { name: name, scopes: scopes, expires_at: 300.days.from_now }
      attrs[:organization] = ORG if ORG && PersonalAccessToken.column_names.include?("organization_id")
      t = user.personal_access_tokens.new(attrs)
      t.set_token(value)
      t.save!
      log "#{name} token seeded for #{user.username}"
    end

    def ensure_project(group, owner, path, visibility, seed_dir)
      project = Project.find_by_full_path("#{group.full_path}/#{path}")
      unless project
        project = Projects::CreateService.new(owner, name: path, path: path,
                                              namespace_id: group.id,
                                              visibility_level: visibility).execute
        raise "project #{path}: #{project.errors.full_messages.join(', ')}" unless project.persisted?
        log "project #{project.full_path} created"
      end
      if project.empty_repo? && Dir.exist?(seed_dir)
        files = Dir.children(seed_dir).reject { |f| f.start_with?("..") }
                   .select { |f| File.file?(File.join(seed_dir, f)) }.sort
        # ConfigMap keys can't contain "/": "deploy__x.yaml" -> "deploy/x.yaml"
        actions = files.map do |f|
          { action: :create, file_path: f.gsub("__", "/"), content: File.read(File.join(seed_dir, f)) }
        end
        project.repository.commit_files(owner, branch_name: project.default_branch_or_main,
                                        message: "Initial #{path} scaffold", actions: actions)
        log "project #{project.full_path} seeded: #{files.join(', ')}"
      end
      project
    end

    root = User.find_by_username!("root")

    # --- instance settings ---
    ApplicationSetting.current.update!(signup_enabled: false)
    log "sign-up disabled"

    # --- runner registration token (create_runner only, used by gitlab-runner app) ---
    seed_token(root, "runner-bootstrap", %w[create_runner], ENV["GITLAB_RUNNER_BOOTSTRAP_TOKEN"])

    # --- demo user, pre-linked to its authentik identity (uid = preferred_username) ---
    demo = User.find_by_username("demo")
    unless demo
      params = { username: "demo", name: "Demo User", email: "demo@#{DNS}",
                 force_random_password: true, password_automatically_set: true,
                 skip_confirmation: true }
      params[:organization_id] = ORG.id if ORG
      demo = unwrap(Users::CreateService.new(root, params).execute, :user)
      raise "user demo: #{demo&.errors&.full_messages&.join(', ')}" unless demo&.persisted?
      log "user demo created"
    end
    demo.identities.find_or_create_by!(provider: "openid_connect", extern_uid: "demo")

    # token used by code-server (git, glab, GitLab Workflow extension)
    seed_token(demo, "code-server", %w[api read_repository write_repository read_registry],
               ENV["GITLAB_DEMO_TOKEN"])

    # --- demo-apps group (public: images can be pulled without credentials) ---
    group = Group.find_by_full_path("demo-apps")
    unless group
      params = { name: "demo-apps", path: "demo-apps",
                 visibility_level: Gitlab::VisibilityLevel::PUBLIC }
      params[:organization_id] = ORG.id if ORG
      group = unwrap(Groups::CreateService.new(root, params).execute, :group)
      raise "group demo-apps: #{group&.errors&.full_messages&.join(', ')}" unless group&.persisted?
      log "group demo-apps created"
    end
    group.add_member(demo, Gitlab::Access::OWNER) unless group.member?(demo, Gitlab::Access::OWNER)

    # --- projects ---
    codeshell = ensure_project(group, demo, "codeshell", Gitlab::VisibilityLevel::PUBLIC, "/opt/seed/codeshell")

    # CI "deploy" job commits the new image tag to deploy/code-server-values.yaml
    var = codeshell.variables.find_or_initialize_by(key: "DEPLOY_TOKEN")
    var.update!(value: ENV["GITLAB_DEMO_TOKEN"].to_s, masked: true, protected: false)
    log "codeshell CI variable DEPLOY_TOKEN set"

    log "demo bootstrap done"
